[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NTFY_TOPIC = "mlst-alerts-h3m8w1"

[functions]
  node_bundler = "esbuild"

[functions."check-alerts"]
  schedule = "*/30 9-22 * * 1-5"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
